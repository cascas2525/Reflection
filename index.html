<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reflections — SAD- A</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #7CB88F;
    --card: #FFFFFF;
    --border: #E3E3DF;
    --text: #232320;
    --text-muted: #6E6E68;
    --accent: #2F6F5E;
    --mono: 'Space Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ min-height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 28px;
    padding: 30px 16px;
  }

  .card{
    width:100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 36px 34px 30px;
  }

  .tag{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }
  .tag::before{ content: "> "; }

  h1{
    font-size: 26px;
    font-weight: 600;
    margin: 10px 0 4px;
    letter-spacing: -0.01em;
  }

  .subject{
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 26px;
  }

  textarea{
    width: 100%;
    min-height: 220px;
    background: transparent;
    border: none;
    border-top: 1px solid var(--border);
    resize: vertical;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    outline: none;
    padding: 20px 0 0;
    display:block;
  }
  textarea::placeholder{ color: #00d87e; }

  footer{
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display:flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  @media (max-width: 600px){
    .card{ padding: 28px 22px 24px; }
    h1{ font-size: 22px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="tag">reflection 1</div>
    <h1>My Reflection</h1>
    <div class="subject">BSCS- 2 | SAD - A</div>

    <textarea placeholder="For me, learning about Information Systems and the IPO Model made me realize how much we actually use technology in our everyday lives. Before this topic, I thought an information system was mainly about computers and software. But I learned that it also includes people, data, hardware, software, and communication that work together to provide useful information. It also helps organizations with their daily activities and decision-making. 

I also learned about the Input-Process-Output or IPO Model. At first it seemed like a simple concept, but I realized that it is something we can see in many things we do every day. We give an input then system processes it, and then we get an output or result. For example, when we enter information into an application, the system processes the information and gives us the result we need. This topic also made me realize how important information systems are in our daily lives. We use technology for school, communication, work, and even for simple tasks. Sometimes we don't really think about what happens behind the technology we use, but there is a system working in the background to process the information and give us what we need. 

I think learning these topics will also help me in the future, especially in my studies and career in technology. It gives me a better idea of how systems work and how information can be turned into something useful. Overall, I learned that technology is not just about using computers. It is also about how we handle information and how systems help make our tasks easier and more organized.
"></textarea>

    <footer>
      <span>— Delos Reyes, Harvey B. </span>
      <span>Aug 11, 2026</span>
    </footer>
  </div>

  <div class="card">
    <div class="tag">reflection 2</div>
    <h1>My Reflection</h1>
    <div class="subject">BSCS- 2 | SAD - A</div>

    <textarea placeholder="I learned that a Data Flow Diagram (DFD) is important for showing how data moves through a system. I learned that each process, data flow, data store, and external entity should be properly connected and logically arranged. I also realized that a logical DFD focuses more on what the system does with the data rather than the specific technology used. This helped me understand how to create a clearer and more organized representation of a system."></textarea>

    <footer>
      <span>— Delos Reyes, Harvey B. </span>
      <span>Sep 8, 2026</span>
    </footer>
  </div>

  <div class="card">
    <div class="tag">reflection 3</div>
    <h1>My Reflection</h1>
    <div class="subject">BSCS- 2 | SAD - A</div>

    <textarea placeholder="In our class, I learned that Structured English helps explain a system’s process through simple and clear instructions. Using sequence, conditions, and repetition makes it easier to organize the steps and understand what should happen in different situations. I also learned that the goal is to describe the logic clearly without having to write actual programming code. This lesson made me realize how important it is to read the scenario carefully before writing the steps. A wrong condition or a missing action can change the result of the process. 
      I learned to be more careful with statements like IF, ELSE, and ENDIF and to check whether the instructions follow the given rules. As a Computer Science student, I can use this skill to plan my program’s logic before coding."></textarea>

    <footer>
      <span>— Delos Reyes, Harvey B. </span>
      <span>Oct 10, 2026</span>
    </footer>
  </div>


</body>
</html>
